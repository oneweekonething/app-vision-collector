name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base dependencies (no model SDK)
        run: pip install -r requirements.txt
      - name: Caller workflow without model SDK or keys
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('openai') is None"
          python -m unittest discover -s tests -p 'test_caller_collect.py' -v
      - name: Install optional compatibility dependencies and lint
        run: pip install -r requirements-api.txt ruff
      - name: Lint
        run: ruff check scripts tests
      - name: Unit tests (no device / no API key required)
        run: python -m unittest discover -s tests -v
